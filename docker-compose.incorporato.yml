version: "3.8"

# Mappa delle gelaterie premiate dalla guida Gelaterie d'Italia 2027 del
# Gambero Rosso. Sito statico, nessuna chiamata verso l'esterno: i dati e la
# geometria della mappa sono dentro l'immagine.
#
# Generato da build.py: non modificare a mano, si riscrive tutto.

services:
  gelaterie:
    build:
      context: .
      dockerfile_inline: |
        FROM nginx:alpine

        # Compressione: i due JSON pesano mezzo mega in chiaro, un centinaio
        # di kilobyte compressi. Su rete locale non cambia la vita, ma il
        # primo caricamento da telefono si', e costa poche righe.
        # Niente printf con le sequenze tipo barra-rovescia-n: dentro un
        # Dockerfile se le prende il parser prima che le veda la shell.
        # E $$ perche' altrimenti compose sostituirebbe $uri con il vuoto.
        RUN C=/etc/nginx/conf.d/default.conf \
            && echo 'server {'                                      >  $$C \
            && echo '  listen 80;'                                  >> $$C \
            && echo '  root /usr/share/nginx/html;'                 >> $$C \
            && echo '  gzip on;'                                    >> $$C \
            && echo '  gzip_min_length 1024;'                       >> $$C \
            && echo '  gzip_types application/json image/svg+xml;'  >> $$C \
            && echo '  location / { try_files $$uri $$uri/ =404; }' >> $$C \
            && echo '}'                                             >> $$C \
            && mkdir -p /usr/share/nginx/html/data

        # --- data/mappa.json ---
        RUN echo "" > /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64

        # --- data/mappa.json ---
        RUN echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && echo "" >> /tmp/1.b64 \
            && base64 -d < /tmp/1.b64 | gunzip > /usr/share/nginx/html/data/mappa.json && rm /tmp/1.b64

        # --- data/gelaterie.json, favicon.svg, index.html ---
        RUN echo "" > /tmp/2.b64 \
            && echo "" >> /tmp/2.b64 \
            && echo "" >> /tmp/2.b64 \
            && echo "" >> /tmp/2.b64 \
            && echo "" >> /tmp/2.b64 \
            && base64 -d < /tmp/2.b64 | gunzip > /usr/share/nginx/html/data/gelaterie.json && rm /tmp/2.b64 \
            && echo "H4sIAAAAAAAC/4WQQU7DMBBF9z3FaFhjj0NqBRR3wbq9ADuTOLEh2JFj6h4fB1pUVUJIsxg9/T9PmnY5jnD6mPyi0KY0P3Gec2b5gYU48oqIeEkgHJ3Jz+GkkICgqsvgbgPQRtMlyK5PVmFhYI0bbfrZY4lLhMFNk8I70tQXyr9rs04WeoWHBh7ZVtdQw3pYQAN0afjgDcKSYng3pT8MctDbC7g/OwVrftHkvOn0rDCGT9/fmiSTq8sKYs1eVFAJOKOXP41dLV//M74F56+U7fqv3eYLeBHZUVgBAAA=" > /tmp/3.b64 \
            && base64 -d < /tmp/3.b64 | gunzip > /usr/share/nginx/html/favicon.svg && rm /tmp/3.b64 \
            && echo "" > /tmp/4.b64 \
            && echo "" >> /tmp/4.b64 \
            && base64 -d < /tmp/4.b64 | gunzip > /usr/share/nginx/html/index.html && rm /tmp/4.b64

    container_name: mappa-gelaterie
    ports:
      # Cambiare solo il numero a sinistra se la 8092 e' gia' occupata.
      - "8092:80"
    restart: unless-stopped
