server {
  listen 80;
  root /usr/share/nginx/html;

  # I due JSON pesano mezzo mega in chiaro e un centinaio di kilobyte
  # compressi: su rete locale non cambia la vita, ma il primo caricamento
  # da telefono si'.
  gzip on;
  gzip_min_length 1024;
  gzip_types application/json image/svg+xml;

  location / { try_files $uri $uri/ =404; }
}
